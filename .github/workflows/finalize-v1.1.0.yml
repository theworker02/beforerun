name: Finalize BeforeRun v1.1.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-v1.1.0.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Verify source
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          go build ./cmd/beforerun
          go run ./cmd/beforerun scan . --fail-on critical
      - name: Remove one-time workflow and tag clean source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/finalize-v1.1.0.yml
          git add -A
          git commit -m "Prepare BeforeRun v1.1.0 release"
          git push origin HEAD:main
          git tag -a v1.1.0 -m "BeforeRun v1.1.0"
          git push origin v1.1.0
      - name: Publish release assets
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
