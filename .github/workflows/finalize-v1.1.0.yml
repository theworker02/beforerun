name: Finalize BeforeRun v1.1.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-v1.1.0.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Verify source and record diagnostics
        shell: bash
        run: |
          set +e
          {
            echo '$ go version'
            go version
            echo '$ gofmt -l .'
            UNFORMATTED=$(gofmt -l .)
            printf '%s\n' "$UNFORMATTED"
            test -z "$UNFORMATTED"
            echo '$ go vet ./...'
            go vet ./...
            echo '$ go test -race ./...'
            go test -race ./...
            echo '$ go build ./cmd/beforerun'
            go build ./cmd/beforerun
            echo '$ go run ./cmd/beforerun scan . --fail-on critical'
            go run ./cmd/beforerun scan . --fail-on critical
          } > validation.log 2>&1
          STATUS=$?
          set -e
          cat validation.log
          if [ "$STATUS" -ne 0 ]; then
            mkdir -p .release-status
            cp validation.log .release-status/v1.1.0-failure.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            rm -f .github/workflows/finalize-v1.1.0.yml
            git add -A
            git commit -m "Record BeforeRun v1.1.0 validation failure"
            git push origin HEAD:main
            exit "$STATUS"
          fi
      - name: Remove one-time workflow and tag clean source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/finalize-v1.1.0.yml
          rm -f .release-status/v1.1.0-failure.txt
          git add -A
          git commit -m "Prepare BeforeRun v1.1.0 release"
          git push origin HEAD:main
          git tag -a v1.1.0 -m "BeforeRun v1.1.0"
          git push origin v1.1.0
      - name: Publish release assets
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
