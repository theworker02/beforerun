name: Publish v1.0.0 Go Module

on:
  create:

permissions:
  contents: write

jobs:
  publish:
    if: github.ref_type == 'branch' && startsWith(github.ref_name, 'release/v1.0.0')
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Verify complete repository
        shell: bash
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          go build ./cmd/beforerun
          go run ./cmd/beforerun scan . --fail-on critical

      - name: Create semantic version tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin refs/tags/v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 already exists"
          else
            git tag -a v1.0.0 -m "BeforeRun v1.0.0"
            git push origin v1.0.0
          fi

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/work
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="beforerun_v1.0.0_${os}_${arch}"
            dir="dist/work/${name}"
            mkdir -p "$dir"
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=v1.0.0" \
              -o "$dir/beforerun${ext}" ./cmd/beforerun
            cp README.md LICENSE "$dir/"
            if [ "$os" = "windows" ]; then
              (cd "$dir" && zip -q "../../${name}.zip" *)
            else
              tar -C "dist/work" -czf "dist/${name}.tar.gz" "$name"
            fi
          done
          rm -rf dist/work
          (cd dist && sha256sum beforerun_v1.0.0_* > checksums.txt)

      - name: Create or refresh GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 dist/* --clobber
          else
            gh release create v1.0.0 dist/* \
              --title "BeforeRun v1.0.0" \
              --notes-file <(sed -n '/## v1.0.0/,$p' CHANGELOG.md)
          fi

      - name: Request Go proxy indexing
        shell: bash
        run: |
          for attempt in $(seq 1 18); do
            if GOPROXY=https://proxy.golang.org go list -m github.com/theworker02/beforerun@v1.0.0; then
              exit 0
            fi
            echo "Go proxy has not indexed v1.0.0 yet (attempt ${attempt}/18)"
            sleep 10
          done
          echo "Release publication succeeded; Go proxy indexing is still pending and will complete asynchronously."
          exit 0
